<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>Calendrier de l'Avent des mamacitas</title>
<link rel="stylesheet" href="style.css?v=202610282210">
</head>
<body>
<div id="scene">
  <canvas id="vue" aria-hidden="true"></canvas>
  <div id="chalet">
    <div class="ombre"></div>
    <img id="chalet-img" src="img/chalet-ferme.webp" alt="Chalet du calendrier de l'Avent" draggable="false">
    <div id="portes"></div>
  </div>
</div>

<h1 class="titre">Calendrier de l'Avent <em>des mamacitas</em></h1>

<canvas id="neige" aria-hidden="true"></canvas>

<button type="button" id="pano" aria-label="Mode panoramique : tourne ton téléphone" title="Panorama"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c5-3 13-3 18 0M3 7c5 3 13 3 18 0M3 7v10M21 7v10"/><circle cx="12" cy="12" r="2"/></svg></button>
<button type="button" id="son" aria-label="Couper le son" title="Son">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="onde" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="coupe" d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<div id="actions">
  <button type="button" id="ouvrir" aria-label="Ouvrir toutes les portes disponibles">Ouvrir les portes</button>
  <button type="button" id="fermer" aria-label="Fermer toutes les portes">Fermer les portes</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="carte" hidden>
  <div class="carte-voile"></div>
  <article class="carte-boite" role="dialog" aria-modal="true" aria-labelledby="carte-titre">
    <p id="carte-date"></p>
    <h2 id="carte-titre"></h2>
    <div id="carte-corps"></div>
    <button type="button" id="carte-fermer">Fermer</button>
  </article>
</div>

<noscript><p class="noscript">Ce calendrier a besoin de JavaScript pour fonctionner.</p></noscript>

<script src="jours.js?v=202610282210"></script>
<script src="chalet.js?v=202610282210"></script>
<script src="vue.js?v=202610282210"></script>
<script src="neige.js?v=202610282210"></script>
<script src="app.js?v=202610282210"></script>
</body>
</html>
