<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>Calendrier de l'Avent 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene">
  <div id="stage">
    <div id="fond"></div>
    <div id="chalet" aria-label="Chalet du calendrier de l'Avent">
      <div class="cheminee"></div>
      <div class="toit"></div>
      <div class="toit-neige"></div>
      <div class="rebord"></div>
      <div class="mur" id="mur"></div>
      <div class="socle"></div>
    </div>
  </div>
</div>

<h1 class="titre">Calendrier de l'Avent <em>2026</em></h1>

<canvas id="neige" aria-hidden="true"></canvas>

<button type="button" id="son" aria-label="Couper le son" title="Son">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="onde" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="coupe" d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<div id="toast" role="status" aria-live="polite"></div>

<div id="carte" hidden>
  <div class="carte-voile"></div>
  <article class="carte-boite" role="dialog" aria-modal="true" aria-labelledby="carte-titre">
    <p id="carte-date"></p>
    <h2 id="carte-titre"></h2>
    <div id="carte-corps"></div>
    <button type="button" id="carte-fermer">Fermer</button>
  </article>
</div>

<noscript><p class="noscript">Ce calendrier a besoin de JavaScript pour fonctionner.</p></noscript>

<script src="jours.js"></script>
<script src="neige.js"></script>
<script src="app.js"></script>
</body>
</html>
